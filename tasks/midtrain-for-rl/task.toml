version = "1.0"

# Harbor task description. Breakwater runs and grades the task from the [breakwater] tables below
# (breakwater/SPEC.md); tests/test.sh refuses to run outside it.

[metadata]
author_name = "InfiniAILab"
author_email = "yangzho6@andrew.cmu.edu"
difficulty_explanation = "Mid-train Llama-3.2-1B-Base within 12 hours, choosing data, methods and infrastructure, to maximize its benefit from shared 43K-example RL and its unweighted post-RL math, coding and science score"
category = "Algorithm Auto Research"
tags = ["Mid-Training", "Data Mixture", "Llama-3.2", "Megatron", "RL-Readiness"]

[verifier]
# Integrity judge budget. The fixed RL stage and post-RL evaluation run before the verifier, within
# [breakwater.evaluation] timeout_sec.
timeout_sec = 10800.0

[agent]
# The 12-hour mid-training attempt.
timeout_sec = 43200.0

[environment]
# Built by prepare.sh --images-only (tests/rl_eval/Dockerfile, target agent, tagged by environment/Dockerfile).
docker_image = "midtrain-for-rl:local"
build_timeout_sec = 7200.0
gpus = 4
gpu_types = ["GB300"]
storage_mb = 100000

# Breakwater: see breakwater/SPEC.md. [agent] timeout_sec is the authoring budget; [environment] gpus,
# gpu_types and workdir apply too.
[breakwater]
name = "midtrain-for-rl"
failure_reward = 0.0
agent_deadline = "evaluate"
review_profile = "indexed"
review_metadata_paths = ["out/processed_dataset"]

[breakwater.judge]
timeout_sec = 10800

[breakwater.workspace]
excludes = ["/README.md", "out", "scratch", "data", "artifacts", "private", ".downloads", ".tools-venv"]
snapshot_excludes = ["scratch"]
dataset_manifest = "/app/out/training_dataset.json"
dataset_roots = ["/app/out/processed_dataset"]

[breakwater.workspace.shadow_policy]
packages = []
hooks = []
environments = false

[breakwater.evaluation]
timeout_sec = 86400
network = "bridge"
cap_add = ["NET_ADMIN", "NET_RAW"]
env = ["MIDTRAIN_CODE_SANDBOX_URL", "MIDTRAIN_CODE_SANDBOX_TOKEN"]
add_hosts = ["host.docker.internal:host-gateway"]

[breakwater.scoring]
recomputed = ["raw/rl/evaluation/*.generations.jsonl"]

[breakwater.resources]
shm_size = "64g"
memlock = -1
stack = 67108864

[[breakwater.assets]]
name = "base-model"
source = "artifacts/Llama-3.2-1B"
target = "/app/models/Llama-3.2-1B"
stages = ["agent"]

[[breakwater.assets]]
name = "evaluation-base-model"
source = "artifacts/Llama-3.2-1B"
target = "/private/base-model"
stages = ["evaluation", "verifier"]

[[breakwater.assets]]
name = "training-data"
source = "data"
target = "/app/data"
stages = ["agent"]

[[breakwater.assets]]
name = "rl-data"
source = "private/rl-data"
target = "/private/midtrain-rl-data"
stages = ["evaluation", "verifier"]

[[breakwater.assets]]
name = "eval-data"
source = "private/eval-data"
target = "/private/midtrain-eval"
stages = ["evaluation", "verifier"]
