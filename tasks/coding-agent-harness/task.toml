schema_version = "1.1"

# Launched with python3 -m breakwater run, which runs authoring, the validity battery and the final verifier in three
# separate stages; the task contract is the [breakwater] tables below. The harness score comes from the downstream
# grid (grid/grid.py), which runs eval/e2e_tasks/ with the drivers and profile in eval/config.json.

[task]
name = "singularity-bench/coding-agent-harness"
description = "Build a whole agentic coding harness behind one entry point: prompt, tools, tool execution, permissioning, context management, fault handling and stopping. Scored by pointing the submitted run() at real repositories with real models and letting each of those tasks' own verifiers say whether the work got done."
keywords = ["agent-harness", "coding-agent", "end-to-end", "python-stdlib", "gpu-development"]

[metadata]
author_name = "InfiniAILab"
author_email = "krisha2@andrew.cmu.edu"
difficulty_explanation = "Build a coding-agent harness from scratch within 6 hours using only the Python standard library; scored by the mean downstream score over three kernel-generation and two vLLM bug-fixing tasks, each driven by three different models"
category = "Agent Systems"
tags = ["Agent Harness", "Coding Agent", "Kernel Generation", "vLLM", "Tool Use"]

[verifier]
# Final verifier (breakwater/verifier.py): a separate read-only container with no GPU that checks the sealed
# evidence, recomputes the validity battery from its raw records and runs the integrity judge. The root reward
# is gradeability (1.0 or 0.0); the harness score is the downstream grid mean.
environment_mode = "separate"
timeout_sec = 10800.0

[agent]
# Authoring budget: six hours on one GB300 GPU, plus the development gateway's 5M chat and 20M embedding
# tokens ([breakwater.model_access]).
timeout_sec = 21600.0

[environment]
# environment/Dockerfile builds the task runtime; the protected author image (breakwater/author/Dockerfile) is
# built on top of it.
docker_image = "coding-agent-harness:local"
build_timeout_sec = 2400.0
cpus = 4
memory_mb = 16384
storage_mb = 32768
# One GPU for development. The model gateways are hosted API proxies, so there are no local model weights.
gpus = 1
gpu_types = ["GB300"]

# Breakwater: see breakwater/SPEC.md. [agent] timeout_sec is the authoring budget; [environment] gpus,
# gpu_types and workdir apply too.
[breakwater]
name = "coding-agent-harness"
failure_reward = 0.0
agent_deadline = "evaluate"
review_profile = "indexed"

[breakwater.judge]
timeout_sec = 10800

[breakwater.workspace]
source = "image"
protected_paths = ["spec", "smoke", "examples", "selfcheck.py", "harness_api.py"]

[breakwater.workspace.shadow_policy]
extra_packages = ["pytest", "_pytest", "pluggy", "einops"]

[breakwater.evaluation]
timeout_sec = 3600
runners = "runners"
shared = ["/eval-work"]

[breakwater.evaluation.worker_env]
PATH = "/usr/local/cuda/bin:/usr/local/bin:/usr/bin:/bin"
HOME = "/tmp/worker"
TMPDIR = "/tmp/worker"
BREAKWATER_WORKDIR = "/app"
LANG = "C.UTF-8"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
CUDA_HOME = "/usr/local/cuda"
HARNESS_LLM_BASE_URL = "http://gateway:8000/v1"
HARNESS_CHAT_MODEL = "chat"
HARNESS_EMBED_MODEL = "embed"

[breakwater.resources]
cpus = 4
memory_mb = 16384
shm_size = "2g"

[breakwater.model_access]
upstream = "https://api.fireworks.ai/inference/v1"
key_env = "FIREWORKS_API_KEY"
embed_model = "accounts/fireworks/models/qwen3-embedding-8b"
max_chat_tokens = 5000000
max_embed_tokens = 20000000

[breakwater.model_access.chat_models]
chat = "accounts/fireworks/models/glm-5p3"
chat-b = "accounts/fireworks/models/kimi-k3"

# The development gateway's address and aliases for the agent's commands, as the instruction publishes them.
[breakwater.authoring.env]
HARNESS_LLM_BASE_URL = "http://gateway:8000/v1"
HARNESS_CHAT_MODEL = "chat"
HARNESS_EMBED_MODEL = "embed"
